AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda (container image) and HTTP API Gateway for the MLBStats REST API.

# Image tag is read from SSM at deploy time:
#   /mlbstats/api/image-tag
# The Makefile `push-api` target writes the tag after a successful docker push.

Resources:

  # ---- Logs -----------------------------------------------------------------

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/mlbstats-api
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: MLBStats

  # ---- IAM ------------------------------------------------------------------

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mlbstats-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadDBParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mlbstats/db/connection-string"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Project
          Value: MLBStats

  # ---- Lambda ---------------------------------------------------------------

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: mlbstats-api
      PackageType: Image
      Code:
        ImageUri: !Sub
          - "${RepoUri}:{{resolve:ssm:/mlbstats/api/image-tag}}"
          - RepoUri: !ImportValue mlbstats-ecr-ApiRepositoryUri
      Role: !GetAtt ApiRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DB_CONNECTION_PARAMETER: /mlbstats/db/connection-string
      Tags:
        - Key: Project
          Value: MLBStats

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # ---- API Gateway (HTTP API v2) --------------------------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: mlbstats-api
      ProtocolType: HTTP
      Description: MLBStats REST API — HTTP API gateway for the FastAPI Lambda.
      Tags:
        Project: MLBStats

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      Tags:
        Project: MLBStats


Outputs:
  ApiEndpointUrl:
    Description: Base URL for the MLBStats HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpointUrl"
